version: '3.8'

services:
  postgres_db:
    image: postgres:15-alpine
    container_name: sst_postgres_container
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: tu_clave_secreta_aqui
      POSTGRES_DB: sst_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

volumes:
  postgres_data:
